[project]
name = "dsci-522-group-2-predicting-white-wine-quality"
version = "0.1.0"
description = "Predicting white wine quality from physicochemical measurements."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
]

[tool.uv]
# `uv add` writes an exact version (==)
add-bounds = "exact"
